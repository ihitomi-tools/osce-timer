            <button type="button" class="btn-sub is-quiet" id="man-del" hidden>消す</button>
          </div>
          <div>
            <input type="text" id="m-situ" class="text-box" aria-label="状況" value="ここは初診外来です。">
            <div class="chips" style="margin-top:8px">
              <button type="button" data-fill="ここは初診外来です。">初診外来</button>
              <button type="button" data-fill="ここは救急外来です。">救急外来</button>
            </div>
          </div>
          <div class="pre-grid">
            <input type="text" id="m-last" class="text-box" aria-label="姓" placeholder="姓（〇〇）" autocomplete="off">
            <input type="text" id="m-first" class="text-box" aria-label="名" placeholder="名（〇〇）" autocomplete="off">
            <input type="text" id="m-age" class="text-box" aria-label="年齢" placeholder="年齢（歳）" inputmode="numeric" autocomplete="off">
            <select id="m-sex" class="select-box" aria-label="性別"><option value="女性">女性</option><option value="男性">男性</option></select>
          </div>
        </div>
      </div>
    </div>

    <button type="button" class="btn-next" id="go-timer">タイマー画面へ</button>
    <section id="rec-wrap" hidden>
      <h2>保存した録音</h2>
      <p class="help" id="rec-help"></p>
      <div id="rec-list"></div>
    </section>

    <div class="setup-foot">
    <p id="offline-status" data-state="checking" role="status">オフライン準備中…</p>
    <p id="offline-hint" hidden>ホーム画面に追加しておくと、端末に保存されたデータが消えにくくなります（共有ボタン →「ホーム画面に追加」）。</p>
    </div>
   </div>
  </main>

  <!-- ===================== タイマー画面 ===================== -->
  <div id="app">
    <section id="task-panel" aria-label="課題文">
      <div class="peek-bar"></div>
      <div class="task-tag" id="task-tag"></div>
      <div id="task-body"></div>
    </section>

    <section id="timer-section">
      <button type="button" class="btn-back" id="btn-back">◀ 戻る</button>
      <button type="button" id="btn-view" aria-label="課題文とタイマー、どちらを大きく見せるか切り替える"><span>課題文</span><span>タイマー</span></button>
      <div id="awake-badge" aria-live="off"></div>
      <div id="rec-badge" aria-live="off">録音中</div>
      <div id="read-caption">課題文を読む時間</div>
      <div id="timer-display" aria-live="off">00:00</div>
      <div id="controls">
        <button type="button" class="btn-jump" id="btn-back30" aria-label="30秒戻る">−30</button>
        <button type="button" class="btn-seek" id="btn-rewind" aria-label="巻き戻し（長押しで加速）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6v12L2 12zM21 6v12l-9-6z"/></svg>
        </button>
        <button type="button" class="btn-start" id="btn-start" data-state="idle">スタート</button>
        <button type="button" class="btn-seek" id="btn-forward" aria-label="早送り（長押しで加速）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6v12l9-6zM3 6v12l9-6z"/></svg>
        </button>
        <button type="button" class="btn-jump" id="btn-fwd30" aria-label="30秒進む">＋30</button>
        <button type="button" class="btn-skip" id="btn-skip">開始へ</button>
      </div>
      <div id="stop-wrap">
        <button type="button" class="btn-stop" id="btn-stop">■ 終了</button>
        <p id="stop-note" role="status"></p>
      </div>
      <div><button type="button" class="btn-reset" id="btn-reset">リセット</button></div>
    </section>

    <button type="button" id="task-mini" aria-label="課題文を見る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 3.5V8h4.5zM8.5 12h8v1.5h-8zm0 3.5h8V17h-8z"/></svg>
      <span class="mini-label">課題文</span><span class="mini-tag" id="mini-tag"></span>
      <span class="mini-info" id="mini-info"></span>
      <span class="mini-more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 3.5V8h4.5zM8.5 12h8v1.5h-8zm0 3.5h8V17h-8z"/></svg>全文</span>
    </button>
  </div>

  <script src="jszip.min.js"></script>
  <script>
    'use strict';

    /* ==============================================================
       設定（時間・音声はここだけ直せばOK）

       cues（音声）の kind
         intro   … 開始ボタンを押すと最初に流れ、終わってからカウントが始まる
         endAt   … 「at 秒ちょうどに言い終わる」ように、音声の長さを測って早めに流す
                   （長さが測れないときは lead 秒前に流す）
         startAt … at 秒ちょうどに流し始める
       ============================================================== */
    const INTERVIEW_BODY = '身体診察では何の診察をしているか、また具体的な所見を述べながら行ってください。適宜、別紙「指導医への報告のためのメモ用紙」を使用してください。メモ用紙は評価対象とはしませんが、終了後回収します。';
    const DEFAULT_NOTE = '身体診察中も病歴を医療面接模擬患者に尋ねることが可能です。';

    const PRESETS = {
      postcc16: {
        label: 'PostCC 16分',
        totalSec: 16 * 60,
        warnSec: null,
        defaultNote: DEFAULT_NOTE,
        blocks: [
          { id: 'interview', title: '医療面接と身体診察', minutes: 12, startSec: 0, body: INTERVIEW_BODY },
          { id: 'report', title: '情報整理と指導医への報告', minutes: 4, startSec: 12 * 60,
            body: '指導医への報告には以下の点を含めてください。',
            bullets: ['患者から得た情報', '鑑別すべき病態・疾患とその根拠'] },
        ],
        cues: [
          { id: 'start',  file: 'start.mp3', kind: 'intro' },
          { id: 'warn',   file: '10min.mp3', kind: 'endAt', at: 10 * 60, lead: 2 },   // 「残り2分」
          { id: 'report', file: '12min.mp3', kind: 'endAt', at: 12 * 60, lead: 7 },   // 「報告に移ります」
          { id: 'end',    file: 'end.mp3',   kind: 'startAt', at: 16 * 60 },
        ],
      },
      precc10: {
        label: 'PreCC 10分',
        totalSec: 10 * 60,
        warnSec: 8 * 60,
        defaultNote: [
          '順序立った、流れに沿った円滑な医療面接を心がけてください。',
          '必要があればメモを取ってください。メモ用紙は、面接終了後回収します。持ち出さないでください。試験開始前のメモ用紙の使用は禁止します。',
          '必要な場合は試験開始前に患者さんと自分の椅子を適切な位置と向きに調整しても構いません。',
        ],
        blocks: [{ id: 'interview', title: '医療面接', minutes: 10, startSec: 0,
          body: ['下記の項目（●）の医療面接を行ってください。', '制限時間は10分間です。'],
          bullets: ['導入：オープニング', '良好なコミュニケーション', '医学的情報を聞く', '心理・社会的情報を聞く', '締めくくり'] }],
        cues: [
          { id: 'start', file: 'precc-start.mp3', kind: 'intro' },                               // 「試験を開始してください」
          { id: 'warn',  file: 'precc-2min.mp3',  kind: 'endAt', at: 8 * 60, lead: 3 },        // 「試験は残り2分です」
          { id: 'end',   file: 'precc-end.mp3',   kind: 'startAt', at: 10 * 60 },               // 「試験を終了してください」
        ],
      },
    };

    const READ_FILE = 'reading_assignment.mp3';   // 入室の案内「課題文を読み、試験開始の合図を待ってください」（読む時間の頭で流す）
    const READ_SEC = 60;         // 「入室から」で、課題文を読む時間
    const PEEK_SEC = 5;          // 課題文を拡大して見せる秒数
    const ARM_MS = 3000;         // 「もう一度タップ」の待ち時間

    /* ==============================================================
       小さな道具
       ============================================================== */
    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, '0');
    const formatTime = (sec) => `${pad2(Math.floor(sec / 60))}:${pad2(sec % 60)}`;
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

    // 端末への保存（使えない環境でも画面は動くように、必ず try で包む）
    const store = {
      get(key, fallback) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
      },
      set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 無視 */ } },
      remove(key) { try { localStorage.removeItem(key); } catch (e) { /* 無視 */ } },
    };

    const state = {
      preset: PRESETS.precc10,
      mode: 'study',
      readSec: 0,          // 課題文を読む時間（0なら「開始から」）
      scenario: null,      // 表示する課題文（なければ null）
    };

    /* ==============================================================
       音声
       ============================================================== */
    const audio = {
      els: {},
      ctx: null,

      // 時間の種類を選んだときに、その音声だけを用意する
      load(preset) {
        this.els = {};
        preset.cues.concat([{ file: READ_FILE }]).forEach((c) => {
          if (this.els[c.file]) return;
          const a = new Audio();
          a.preload = 'auto';
          a.src = c.file;
          this.els[c.file] = a;
        });
      },

      // iOSは、ユーザーが触れたタイミングで一度鳴らしておかないと、あとで自動再生できない
      unlock() {
        Object.values(this.els).forEach((a) => {
          if (a._unlocked) return;
          a._unlocked = true;
          a.muted = true;
          const restore = () => { a.pause(); a.currentTime = 0; a.muted = false; };
          const p = a.play();
          if (p && p.then) p.then(restore).catch(() => { a.muted = false; });
          else restore();
        });
      },

      stopAll() { Object.values(this.els).forEach((a) => { a.pause(); a.currentTime = 0; }); },

      duration(file) {
        const a = this.els[file];
        return a && isFinite(a.duration) && a.duration > 0 ? a.duration : null;
      },

      play(file) {
        const a = this.els[file];
        if (!a) return Promise.reject(new Error('no audio'));
        a.muted = false;
        a.currentTime = 0;
        const p = a.play();
        return p || Promise.resolve();
      },

      // 終了音。鳴らせないときは合成のチャイムで代用する
      playEnd(file) { this.play(file).catch(() => this.chime()); },

      chime() {
        try {
          this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, t);
          gain.gain.setValueAtTime(0.8, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 2.5);
        } catch (e) { /* 音が出せなくても画面の動作は止めない */ }
      },
    };

    // 音声が流れ始める時刻（ミリ秒）
    function cueTriggerMs(cue) {
      if (cue.kind === 'endAt') {
        const lead = audio.duration(cue.file) ?? cue.lead;
        return Math.max(0, cue.at - lead) * 1000;
      }
      return cue.at * 1000;
    }

    /* ==============================================================
       画面を消さない（実施中に端末がスリープしないように）
       ① Screen Wake Lock … 対応している端末では、これが本命
       ② ほぼ見えない小さな動画を流し続ける … ①が使えない端末向けの補助
       どちらが効いているかは、タイマー画面の上の小さな表示で分かります。
       ============================================================== */
    const awake = {
      sentinel: null,
      active: false,
      videoOn: false,

      start() {
        this.active = true;
        this.lock();
        const v = $('awake-video');
        const p = v.play();
        const on = () => { this.videoOn = true; this.badge(); };
        if (p && p.then) p.then(on).catch(() => { this.videoOn = false; this.badge(); }); else on();
        this.badge();
      },
      async lock() {
        try {
          if ('wakeLock' in navigator && !this.sentinel) {
            this.sentinel = await navigator.wakeLock.request('screen');
            this.sentinel.addEventListener('release', () => { this.sentinel = null; this.badge(); });
          }
        } catch (e) { /* 非対応・拒否は無視 */ }
        this.badge();
      },
      stop() {
        this.active = false;
        if (this.sentinel) { this.sentinel.release().catch(() => {}); this.sentinel = null; }
        const v = $('awake-video');
        v.pause();
        this.videoOn = false;
        this.badge();
      },
      badge() {
        const b = $('awake-badge');
        if (!this.active) { b.textContent = ''; return; }
        b.textContent = this.sentinel ? '☀ 画面オン' : this.videoOn ? '☀ 画面オン（補助）' : '';
      },
    };
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && awake.active) {
        awake.lock();
        const v = $('awake-video');
        if (v.paused) v.play().catch(() => {});
      }
    });


    /* ==============================================================
       録音（任意）。録音は、この端末の中（IndexedDB）にだけ一時保存する。外へは送らない。
       ・「スタート」で始まり、「一時停止」で一時停止、「リセット」「戻る」で終了して保存
       ・保存した録音は、一覧から「共有・保存」で別の場所へ移せる。一定日数で自動的に消える
       ============================================================== */
    const REC_DAYS = 7;
    const recdb = {
      db: null,
      open() {
        if (this.db) return Promise.resolve(this.db);
        return new Promise((resolve, reject) => {
          const r = indexedDB.open('osce-rec', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('recs', { keyPath: 'id' });
          r.onsuccess = () => { this.db = r.result; resolve(r.result); };
          r.onerror = () => reject(r.error);
        });
      },
      async run(mode, fn) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('recs', mode);
          const req = fn(tx.objectStore('recs'));
          tx.oncomplete = () => resolve(req && req.result);
          tx.onerror = () => reject(tx.error);
        });
      },
      put(rec) { return this.run('readwrite', (st) => st.put(rec)); },
      del(id) { return this.run('readwrite', (st) => st.delete(id)); },
      all() { return this.run('readonly', (st) => st.getAll()).then((v) => v || []); },
    };
    const REC_OK = !!(window.indexedDB && window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

    const rec = {
      on: false, mr: null, stream: null, chunks: [], accumMs: 0, segStart: 0, starting: false, meta: null,

      badge(mode) {   // 'on' / 'paused' / ''
        const b = $('rec-badge');
        b.className = mode ? 'is-' + mode : '';
        b.textContent = mode === 'paused' ? '録音一時停止中' : '録音中';
      },
      message(text) { const m = $('rec-msg'); m.textContent = text || ''; m.hidden = !text; },

      // 「あり」にした瞬間にマイクの許可を求める（すぐ解放する）
      async enable() {
        if (!REC_OK) { this.message('この端末では録音を使えません'); return false; }
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio: true });
          s.getTracks().forEach((t) => t.stop());
          if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
          this.on = true; this.message('');
          return true;
        } catch (e) {
          this.message('マイクが許可されませんでした。端末の設定でマイクを許可してください');
          return false;
        }
      },
      disable() { this.on = false; this.message(''); },

      // タイマーが動き出した（または再開した）とき
      async onRun() {
        if (!this.on) return;
        if (this.mr) {
          if (this.mr.state === 'paused') { this.mr.resume(); this.segStart = performance.now(); this.badge('on'); }
          return;
        }
        if (this.starting) return;
        this.starting = true;
        try {
          this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'].find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
          this.mr = type ? new MediaRecorder(this.stream, { mimeType: type }) : new MediaRecorder(this.stream);
          this.chunks = []; this.accumMs = 0; this.segStart = performance.now();
          this.meta = { createdAt: Date.now(), preset: state.preset === PRESETS.precc10 ? 'PreCC' : 'PostCC', mode: state.mode === 'exam' ? '試験仕様' : '学習会仕様' };
          const mr = this.mr, chunks = this.chunks, meta = this.meta;
          mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
          mr.onstop = () => this.save(mr, chunks, meta);
          mr.start(10000);
          this.badge('on');
        } catch (e) {
          this.mr = null;
          if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
          this.badge('');
          this.message('録音を始められませんでした');
        } finally { this.starting = false; }
      },

      pause() {
        if (!this.mr || this.mr.state !== 'recording') return;
        this.accumMs += performance.now() - this.segStart;
        this.mr.pause();
        this.badge('paused');
      },

      // 終了して保存
      finish() {
        if (!this.mr) { this.badge(''); return false; }
        const mr = this.mr;
        if (mr.state === 'recording') this.accumMs += performance.now() - this.segStart;
        this.meta.durationSec = Math.round(this.accumMs / 1000);
        this.mr = null;
        this.badge('');
        try { if (mr.state !== 'inactive') mr.stop(); } catch (e) { /* 無視 */ }
        if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
        return true;
      },

      async save(mr, chunks, meta) {
        if (!chunks.length || (meta.durationSec || 0) < 2) return;   // ごく短いものは保存しない
        const mime = mr.mimeType || chunks[0].type || 'audio/mp4';
        const blob = new Blob(chunks, { type: mime });
        try {
          await recdb.put(Object.assign({ id: meta.createdAt, mime, size: blob.size, blob }, meta));
          recList.render();
          this.message('録音を保存しました（下の「保存した録音」から）');
          setTimeout(() => { if ($('rec-msg').textContent.startsWith('録音を保存')) this.message(''); }, 6000);
        } catch (e) { this.message('録音を保存できませんでした'); }
      },
    };

    const recList = {
      urls: [],
      fileName(r) {
        const d = new Date(r.createdAt), z = (n) => String(n).padStart(2, '0');
        const ext = /mp4|aac/.test(r.mime) ? 'm4a' : /ogg/.test(r.mime) ? 'ogg' : 'webm';
        return `OSCE録音_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}_${r.preset}.${ext}`;
      },
      async purge() {
        const limit = Date.now() - REC_DAYS * 86400000;
        const all = await recdb.all();
        for (const r of all) if (r.createdAt < limit) await recdb.del(r.id);
      },
      async render() {
        const wrap = $('rec-wrap'), box = $('rec-list');
        let all = [];
        try { all = (await recdb.all()).sort((a, b) => b.createdAt - a.createdAt); } catch (e) { /* 使えない環境 */ }
        this.urls.forEach((u) => URL.revokeObjectURL(u)); this.urls = [];
        box.textContent = '';
        wrap.hidden = !all.length;
        $('rec-help').textContent = `録音は、この端末の中にだけあります。必要なものは「共有・保存」で別の場所へ移してください。${REC_DAYS}日たつと自動で消えます。`;
        all.forEach((r) => {
          const d = new Date(r.createdAt);
          const left = Math.max(0, Math.ceil((r.createdAt + REC_DAYS * 86400000 - Date.now()) / 86400000));
          const item = document.createElement('div'); item.className = 'rec-item';
          const t = document.createElement('p'); t.className = 'rec-title';
          t.textContent = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}　${r.preset}（${r.mode}）`;
          const sub = document.createElement('p'); sub.className = 'rec-sub';
          sub.textContent = `${formatTime(r.durationSec || 0)}　${(r.size / 1048576).toFixed(1)}MB　あと${left}日で消えます`;
          const btns = document.createElement('div'); btns.className = 'rec-btns';
          const mk = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.addEventListener('click', () => fn(b)); btns.appendChild(b); return b; };
          let audioEl = null;
          mk('再生', () => {
            if (audioEl) { audioEl.pause(); audioEl.remove(); audioEl = null; return; }
            const u = URL.createObjectURL(r.blob); this.urls.push(u);
            audioEl = document.createElement('audio'); audioEl.controls = true; audioEl.src = u;
            item.insertBefore(audioEl, btns); audioEl.play().catch(() => {});
          });
          mk('共有・保存', async () => {
            const file = new File([r.blob], this.fileName(r), { type: r.mime });
            try {
              if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
            } catch (e) { if (e && e.name === 'AbortError') return; }
            const a = document.createElement('a'); const u = URL.createObjectURL(file);
            a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(u), 10000);
          });
          let armTimer = null;
          mk('削除', (b) => {
            if (!b.classList.contains('is-armed')) {
              b.classList.add('is-armed'); b.textContent = 'もう一度タップ';
              armTimer = setTimeout(() => { b.classList.remove('is-armed'); b.textContent = '削除'; }, 3000);
              return;
            }
            clearTimeout(armTimer);
            recdb.del(r.id).then(() => this.render());
          });
          item.append(t, sub, btns);
          box.appendChild(item);
        });
      },
    };

    /* ==============================================================
       タイマー本体（ミリ秒で正確に測り、画面は秒で表示）
       status: idle(開始前) / preparing(開始音声中) / running / paused / finished
       ============================================================== */
    const timer = {
      status: 'idle',
      elapsedMs: 0,
      baseMs: 0,            // 基準にした経過
      anchorMs: 0,          // その基準を決めた時刻（performance.now）
      fired: new Set(),     // 音声を流し終えた（または通り過ぎた）ものの id
      tickId: null,
      lastActive: -1,
      lastStage: '',
      readBase: 0,          // 読む時間の残り（ミリ秒）の基準
      readAnchor: 0,
      readLeftMs: 0,

      get total() { return state.preset.totalSec; },
      // 学習会仕様は、終了後も数え続ける（超過時間を見るため）。上限は99分59秒
      get limitMs() { return (this.total + (state.mode === 'study' ? 5999 : 0)) * 1000; },
      get elapsed() { return Math.floor(this.elapsedMs / 1000); },
      get cues() { return state.preset.cues.filter((c) => c.kind !== 'intro'); },

      // --- 画面への反映 ---
      render() {
        const P = state.preset;
        const e = this.elapsed;
        const reading = ['readintro', 'reading', 'readpaused'].includes(this.status);
        const over = !reading && state.mode === 'study' && e >= P.totalSec;   // 終了後の超過時間
        $('timer-display').textContent = reading ? formatTime(Math.ceil(this.readLeftMs / 1000)) : over ? '+' + formatTime(e - P.totalSec) : formatTime(e);
        document.body.classList.toggle('is-over', over);
        document.body.dataset.tstate = this.status;
        $('btn-stop').textContent = rec.mr ? '■ 録音を保存して終了' : '■ 終了';

        const finished = e >= P.totalSec;
        let idx = 0;
        P.blocks.forEach((b, i) => { if (e >= b.startSec) idx = i; });
        const phase = finished ? 'finished'
                    : (P.warnSec && e >= P.warnSec) ? 'warn'
                    : P.blocks[idx].id === 'report' ? 'report'
                    : 'interview';
        document.body.dataset.phase = phase;
        document.body.dataset.stage = reading ? 'read' : (this.status === 'idle' && this.elapsedMs === 0) ? 'ready' : 'run';
        if (document.body.dataset.stage === 'ready') peek.close();
        if (document.body.dataset.stage !== this.lastStage) { this.lastStage = document.body.dataset.stage; fitTask(); }

        document.querySelectorAll('.instruction-block').forEach((node, i) => {
          node.classList.toggle('is-active', i === idx);
        });
        if (idx !== this.lastActive) {
          // 場面が切り替わったら、学習会仕様では該当ブロックが見える位置まで動かす
          if (this.lastActive !== -1 && state.mode === 'study' && this.status === 'running') {
            const node = document.querySelectorAll('.instruction-block')[idx];
            if (node && node.scrollIntoView) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          this.lastActive = idx;
        }

        const labels = { idle: state.readSec ? '入室' : 'スタート', preparing: '準備中...', running: '一時停止', paused: '再開', finished: '終了', reading: '一時停止', readpaused: '再開', readintro: '案内中...' };
        const btn = $('btn-start');
        btn.textContent = labels[this.status];
        btn.dataset.state = this.status === 'reading' ? 'running' : this.status === 'readpaused' ? 'paused' : this.status === 'readintro' ? 'preparing' : this.status;
        btn.disabled = this.status === 'preparing' || this.status === 'readintro' || this.status === 'finished';
      },

      // 通り過ぎた音声は「流し終えた」ことにする（早送りで一気に鳴らないように）
      markPassed() {
        this.fired = new Set(this.cues.filter((c) => cueTriggerMs(c) < this.elapsedMs).map((c) => c.id));
      },

      // --- 経過を直接動かす（早送り・ジャンプ用。音は鳴らさない） ---
      setElapsed(sec) {
        this.elapsedMs = clamp(sec, 0, this.limitMs / 1000) * 1000;
        this.baseMs = this.elapsedMs;
        this.anchorMs = performance.now();
        this.markPassed();
        if (this.status === 'running' && this.elapsedMs >= this.limitMs) this.finish();
        else if (this.status === 'finished' && this.elapsedMs < this.limitMs) {
          // 終了後に巻き戻したときは、続きから再開できる状態に戻す
          this.status = this.elapsedMs === 0 ? 'idle' : 'paused';
          $('stop-note').textContent = '';
        }
        this.render();
      },

      // --- 時計を進める（端末の時刻を基準にするので、ずれにくい） ---
      tick() {
        if (this.status === 'reading') {
          this.readLeftMs = Math.max(0, this.readBase - (performance.now() - this.readAnchor));
          if (this.readLeftMs <= 0) { this.stopTicking(); this.playStartVoice(); }   // 読む時間が終わったら、開始の声へ
          else this.render();
          return;
        }
        if (this.status !== 'running') return;
        const totalMs = this.limitMs;
        this.elapsedMs = Math.min(totalMs, this.baseMs + (performance.now() - this.anchorMs));
        for (const c of this.cues) {
          if (this.fired.has(c.id)) continue;
          const at = cueTriggerMs(c);
          if (at > this.elapsedMs) continue;
          this.fired.add(c.id);
          // 画面を閉じていて遅れて戻ったときは、直近の1.5秒以内の音だけ鳴らす
          if (this.elapsedMs - at <= 1500) {
            if (c.id === 'end') audio.playEnd(c.file); else audio.play(c.file).catch(() => {});
          }
        }
        if (this.elapsedMs >= totalMs) this.finish();
        this.render();
      },

      startTicking() { this.stopTicking(); this.tickId = setInterval(() => this.tick(), 100); },
      stopTicking() { if (this.tickId) { clearInterval(this.tickId); this.tickId = null; } },

      // 入室：案内の声を流しながら、課題文を読む時間（声も含めて1分）のカウントダウンを始める
      beginRead() {
        this.status = 'reading';
        this.readBase = state.readSec * 1000;
        this.readLeftMs = this.readBase;
        this.readAnchor = performance.now();
        this.startTicking();
        this.render();
        audio.play(READ_FILE).catch(() => {});
      },

      begin() {
        rec.onRun();
        this.status = 'running';
        this.baseMs = this.elapsedMs;
        this.anchorMs = performance.now();
        this.startTicking();
        this.render();
      },

      finish() {
        rec.finish();
        this.status = 'finished';
        this.elapsedMs = this.limitMs;
        this.stopTicking();
        awake.stop();
      },

      // 一時停止中に「終了」：いまの時間のまま止めて、録音があれば保存する
      stop() {
        if (this.status !== 'paused') return;
        const saved = rec.finish();
        this.stopTicking();
        awake.stop();
        this.status = 'finished';
        $('stop-note').textContent = saved ? '録音を保存しました（設定画面の「保存した録音」にあります）' : '';
        this.render();
      },

      // --- 操作 ---
      toggle() {
        audio.unlock();
        if (this.status === 'reading') {
          this.readBase = this.readLeftMs;
          this.stopTicking();
          this.status = 'readpaused';
          this.render();
        } else if (this.status === 'readpaused') {
          this.readAnchor = performance.now();
          this.status = 'reading';
          this.startTicking();
          this.render();
        } else if (this.status === 'running') {
          this.stopTicking();
          audio.stopAll();
          awake.stop();
          rec.pause();
          this.status = 'paused';
          this.render();
        } else if (this.status === 'idle' || this.status === 'paused') {
          awake.start();                       // 押した瞬間（iPhoneが許す瞬間）に始める
          if (this.elapsedMs === 0 && this.status === 'idle' && state.readSec > 0) this.beginRead();
          else if (this.elapsedMs === 0) this.playStartVoice();
          else this.begin();
        }
      },

      // 読む時間を飛ばして、すぐ開始する
      skipRead() {
        audio.unlock();
        if (!['readintro', 'reading', 'readpaused'].includes(this.status)) return;
        this.stopTicking();
        audio.stopAll();
        this.playStartVoice();
      },

      // 開始音声が終わってからカウントを始める
      playStartVoice() {
        this.status = 'preparing';
        this.render();
        const intro = state.preset.cues.find((c) => c.kind === 'intro');
        const a = intro && audio.els[intro.file];
        const go = () => { if (this.status === 'preparing') this.begin(); };
        if (!a) { go(); return; }
        a.onended = go;       // 代入なので、何度押しても古い処理は残らない
        a.onerror = go;
        audio.play(intro.file).catch(go);
      },

      reset() {
        rec.finish();
        $('stop-note').textContent = '';
        this.stopTicking();
        audio.stopAll();
        awake.stop();
        this.status = 'idle';
        this.readLeftMs = 0;
        this.elapsedMs = 0;
        this.baseMs = 0;
        this.fired = new Set();
        this.lastActive = -1;
        this.render();
        $('task-panel').scrollTop = 0;
      },

      // 場面をタップ → その場面の頭へ。0:00なら最初から、途中の場面ならそのまま動き出す
      jumpToBlock(i) {
        audio.unlock();
        audio.stopAll();
        const b = state.preset.blocks[i];
        if (b.startSec === 0) {
          this.setElapsed(0);
          if (this.status === 'preparing') this.status = 'idle';
          this.render();
          return;
        }
        // その場面へ移る案内音声があれば、その頭から流す
        const lead = state.preset.cues.find((c) => c.kind === 'endAt' && c.at === b.startSec);
        this.status = 'paused';
        awake.start();
        this.setElapsed(lead ? Math.floor(cueTriggerMs(lead) / 1000) : b.startSec);
        this.begin();
      },
    };

    /* ==============================================================
       課題文の表示
       ============================================================== */
    function addP(parent, cls, text) {
      const p = document.createElement('p');
      p.className = cls;
      p.textContent = text;
      parent.appendChild(p);
    }

    function renderTask() {
      const P = state.preset;
      const s = state.scenario;
      const body = $('task-body');
      body.textContent = '';

      if (s) {
        (s.situation || []).forEach((t) => addP(body, 't-situ', t));
        if (s.patient) addP(body, 't-patient', s.patient);
        (s.supplement || []).forEach((t) => addP(body, 't-supp', t));
      }

      P.blocks.forEach((b, i) => {
        const div = document.createElement('div');
        div.className = 'instruction-block';
        div.setAttribute('role', 'button');
        div.tabIndex = 0;
        const title = document.createElement('div');
        title.className = 'block-title';
        const t1 = document.createElement('span'); t1.textContent = b.title;
        const t2 = document.createElement('span'); t2.textContent = `${b.minutes}分間`;
        title.append(t1, t2);
        div.appendChild(title);
        if (b.body || b.bullets) {
          const bd = document.createElement('div');
          bd.className = 'block-body';
          [].concat(b.body || []).forEach((line) => { const tx = document.createElement('div'); tx.className = 'block-text'; tx.textContent = line; bd.appendChild(tx); });
          if (b.bullets) {
            const ul = document.createElement('ul');
            b.bullets.forEach((x) => { const li = document.createElement('li'); li.textContent = x; ul.appendChild(li); });
            bd.appendChild(ul);
          }
          div.appendChild(bd);
        }
        onActivate(div, () => { if (state.mode === 'study') timer.jumpToBlock(i); });
        body.appendChild(div);
      });

      const note = s && s.note && s.note.length ? s.note : (P.defaultNote ? [].concat(P.defaultNote) : []);
      note.forEach((t) => addP(body, 't-note', t));

      // タイマーだけの画面に残す、状況と患者情報
      const info = $('mini-info');
      info.textContent = '';
      const sit = s ? (s.situation || []).join('') : '';
      if (sit) info.appendChild(document.createTextNode(sit));
      if (s && s.patient) { const b = document.createElement('b'); b.textContent = s.patient; info.appendChild(b); }
      $('task-mini').classList.toggle('has-info', !!(sit || (s && s.patient)));

      const tag = (s && s.tag) || '';
      $('task-tag').textContent = tag;
      $('mini-tag').textContent = tag;
      timer.lastActive = -1;
    }

    // 横長の試験仕様：課題文がスクロールなしで収まるように、文字の大きさを自動で合わせる
    const LANDSCAPE = '(orientation: landscape) and (min-width: 640px)';
    function fitTask() {
      const p = $('task-panel');
      p.style.fontSize = '';
      if (getComputedStyle(p).display === 'none') return;
      if (state.mode === 'study') {   // 学習会仕様：課題文の全文が、スクロールなしで収まる大きさまで小さくする
        let fs = parseFloat(getComputedStyle(p).fontSize);
        while (p.scrollHeight > p.clientHeight + 1 && fs > 10) { fs -= 0.5; p.style.fontSize = fs + 'px'; }
        return;
      }
      if (state.mode !== 'exam') return;
      // 読む時間：画面いっぱいに収まる最大の大きさまで、課題文を大きくする
      if (document.body.dataset.stage === 'read') {
        let size = 12;
        p.style.fontSize = size + 'px';
        while (size < 34) {
          p.style.fontSize = (size + 0.5) + 'px';
          if (p.scrollHeight > p.clientHeight + 1) { p.style.fontSize = size + 'px'; break; }
          size += 0.5;
        }
        return;
      }
      if (!window.matchMedia(LANDSCAPE).matches) return;
      let fs = parseFloat(getComputedStyle(p).fontSize);
      while (p.scrollHeight > p.clientHeight + 1 && fs > 9) { fs -= 0.5; p.style.fontSize = fs + 'px'; }
    }
    window.addEventListener('resize', fitTask);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitTask());

    // 試験仕様：課題文を隅に小さく残し、タップで数秒だけ大きく見せる
    const peek = {
      id: null,
      open() {
        const panel = $('task-panel');
        panel.style.setProperty('--peek-sec', PEEK_SEC + 's');
        panel.classList.remove('is-peek');
        void panel.offsetWidth;                 // アニメーションをやり直す
        panel.classList.add('is-peek');
        panel.scrollTop = 0;
        document.body.classList.add('peeking');
        fitTask();
        clearTimeout(this.id);
        this.id = setTimeout(() => this.close(), PEEK_SEC * 1000);
      },
      close() {
        clearTimeout(this.id);
        $('task-panel').classList.remove('is-peek');
        document.body.classList.remove('peeking');
      },
    };

    /* ==============================================================
       PowerPoint（.pptx）から課題文を読み取る
       - 「医療面接」「患者」を含むスライドを課題文とみなし、バイタル・所見などは無視します
       - 主訴（スライド内のメモ書きなど）は読み取っても画面には出しません
       ============================================================== */
    const pptx = {
      norm(s) {
        return s.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
                .replace(/[\s　]+/g, ' ').trim();
      },
      clean(s) {
        return this.norm(s).replace(/^[•・●■◆]\s*/, '')
                .replace(/\s*（\s*/g, '（').replace(/\s*）/g, '）')
                .replace(/\s*\(\s*/g, '（').replace(/\s*\)/g, '）');
      },
      resolve(base, target) {
        if (target.startsWith('/')) return target.slice(1);
        const parts = (base + target).split('/');
        const out = [];
        parts.forEach((p) => { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); });
        return out.join('/');
      },

      // 1枚のスライドを「どの図形にどんな段落があるか」に分解する
      readSlide(doc) {
        const shapes = [];
        Array.from(doc.getElementsByTagName('p:sp')).forEach((sp) => {
          const ph = sp.getElementsByTagName('p:ph')[0];
          const phType = ph ? (ph.getAttribute('type') || 'body') : null;
          const paras = Array.from(sp.getElementsByTagName('a:p'))
            .map((p) => Array.from(p.getElementsByTagName('a:t')).map((t) => t.textContent).join(''))
            .map((t) => this.clean(t))
            .filter((t) => t);
          if (paras.length) shapes.push({ placeholder: !!ph, isTitle: phType === 'title' || phType === 'ctrTitle', paras });
        });
        return shapes;
      },

      parseTask(shapes, nextTitle, index) {
        const main = shapes.find((s) => !s.isTitle && s.paras.some((t) => t.includes('医療面接')) && s.paras.some((t) => /^患者/.test(t)));
        if (!main) return null;
        const paras = main.paras;
        const iMed = paras.findIndex((t) => t.includes('医療面接'));
        const iPat = paras.findIndex((t, i) => i < iMed && /^患者/.test(t));
        const situation = paras.slice(0, Math.max(iPat, 0));
        let patient = iPat >= 0 ? paras[iPat] : '';
        const supplement = paras.slice(iPat + 1, iMed);
        // 「患者 ○○ さん（68歳男性） 右踵骨骨折で…」のように、同じ行に補足が続く資料は、年齢の括弧のあとを補足として分ける
        const sp = /^(.*?（[^）]*(?:歳|か月|ヶ月|ヵ月|週|日)[^）]*）)\s*(.+)$/.exec(patient);
        if (sp) { patient = sp[1]; supplement.unshift(sp[2]); }

        // 末尾の注意書き：報告（または面接）の説明文のあとに残った段落
        let end = -1;
        paras.forEach((t, i) => { if (i > iMed && (t.includes('鑑別すべき') || t.includes('回収'))) end = i; });
        const note = end >= 0 ? paras.slice(end + 1) : [];

        // タグ（シナリオ①など）：課題文スライド内の別の文字 → 次のスライドの題名 → 通し番号
        const others = shapes.filter((s) => s !== main && !s.isTitle).flatMap((s) => s.paras);
        const title = shapes.filter((s) => s.isTitle).flatMap((s) => s.paras);
        let tag = others.concat(title).find((t) => /シナリオ/.test(t));
        if (!tag && nextTitle && /シナリオ/.test(nextTitle)) tag = nextTitle;
        if (!tag) tag = `シナリオ${index + 1}`;

        return { tag, situation, patient, supplement, note };
      },

      async parse(file) {
        if (!window.JSZip) throw new Error('読み込み用の部品が見つかりません。');
        let zip;
        try { zip = await JSZip.loadAsync(await file.arrayBuffer()); }
        catch (e) { throw new Error('PowerPoint（.pptx）のファイルではないようです。'); }
        const dp = new DOMParser();
        const xml = async (path) => {
          const f = zip.file(path);
          return f ? dp.parseFromString(await f.async('string'), 'application/xml') : null;
        };
        const pres = await xml('ppt/presentation.xml');
        const rels = await xml('ppt/_rels/presentation.xml.rels');
        if (!pres || !rels) throw new Error('PowerPoint（.pptx）のファイルではないようです。');

        const relMap = {};
        Array.from(rels.getElementsByTagName('Relationship')).forEach((r) => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });
        const paths = Array.from(pres.getElementsByTagName('p:sldId'))
          .map((n) => relMap[n.getAttribute('r:id')])
          .filter(Boolean)
          .map((t) => this.resolve('ppt/', t));

        const slides = [];
        for (const p of paths) {
          const doc = await xml(p);
          slides.push(doc ? this.readSlide(doc) : []);
        }

        const scenarios = [];
        slides.forEach((shapes, i) => {
          const next = slides[i + 1] || [];
          const nextTitle = (next.find((s) => s.isTitle) || { paras: [''] }).paras[0];
          const sc = this.parseTask(shapes, nextTitle, scenarios.length);
          if (sc) scenarios.push(sc);
        });
        if (!scenarios.length) throw new Error('課題文のスライド（「医療面接」「患者」を含むスライド）が見つかりませんでした。');
        return scenarios;
      },
    };

    /* ==============================================================
       PDFから課題文を読み取る（PowerPointをPDFに変換したもの）
       - 文字の位置から段落を組み直し、PowerPointと同じ規則で課題文を見つけます
       - 画像だけのPDF（スキャンなど）は文字がないため読み取れません
       ============================================================== */
    const pdfdoc = {
      loadPromise: null,
      load() {
        if (window.pdfjsLib) return Promise.resolve();
        if (!this.loadPromise) {
          this.loadPromise = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'pdf.min.js';
            s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js'; resolve(); };
            s.onerror = () => { this.loadPromise = null; reject(new Error('PDF読み込み用の部品を開けませんでした（一度、電波のある所でアプリを開いてください）。')); };
            document.head.appendChild(s);
          });
        }
        return this.loadPromise;
      },

      // 1ページ分の文字を「行 → 段落」にまとめる
      pageParas(items, height) {
        const rows = [];
        items.forEach((it) => {
          const y = it.transform[5];
          const row = rows.find((r) => Math.abs(r.y - y) < 2);
          (row || (rows[rows.length] = { y, items: [] }, rows[rows.length - 1])).items.push(it);
        });
        const lines = rows.map((r) => {
          r.items.sort((a, b) => a.transform[4] - b.transform[4]);
          const text = r.items.map((i) => i.str).join('');
          const h = Math.max(...r.items.map((i) => i.height || 0), 1);
          return { y: r.y, h, text, bullet: /^\s*[•・●■◆]/.test(text) };
        }).filter((l) => l.text.trim()).sort((a, b) => b.y - a.y);

        const paras = [];
        let prev = null;
        lines.forEach((l) => {
          const newPara = !prev || l.bullet || (prev.y - l.y) > l.h * 1.05;   // 行間が広い／箇条書きの記号 → 新しい段落
          if (newPara) paras.push({ text: l.text, y: l.y, lines: 1 });
          else {
            const last = paras[paras.length - 1];
            const glue = /[A-Za-z0-9]$/.test(last.text) && /^[A-Za-z0-9]/.test(l.text) ? ' ' : '';
            last.text += glue + l.text; last.lines++;
          }
          prev = l;
        });
        return paras.map((p) => ({ text: pptx.clean(p.text), y: p.y, single: p.lines === 1, height })).filter((p) => p.text);
      },

      async parse(file) {
        await this.load();
        let doc;
        try { doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), verbosity: 0 }).promise; }
        catch (e) { throw new Error('PDFとして読み込めませんでした。'); }
        const pages = [];
        for (let n = 1; n <= doc.numPages; n++) {
          const page = await doc.getPage(n);
          const height = page.getViewport({ scale: 1 }).height;
          const tc = await page.getTextContent();
          pages.push(this.pageParas(tc.items.filter((i) => typeof i.str === 'string'), height));
        }
        if (!pages.some((p) => p.length)) throw new Error('文字が見つかりませんでした（画像だけのPDFは読み取れません）。');

        // ページの上端・下端に何度も出てくる一行（「学習会 2/18 胸痛」など）は、課題文ではないので除く
        const key = (p) => pptx.norm(p.text).replace(/\s/g, '');
        const seen = {};
        pages.forEach((ps) => new Set(ps.filter((p) => p.single && (p.y > p.height * 0.9 || p.y < p.height * 0.07)).map(key)).forEach((k) => { seen[k] = (seen[k] || 0) + 1; }));
        const body = pages.map((ps) => ps.filter((p) => !(p.single && (p.y > p.height * 0.9 || p.y < p.height * 0.07) && seen[key(p)] >= 2)));

        const scenarios = [];
        body.forEach((ps, i) => {
          const shapes = [{ placeholder: false, isTitle: false, paras: ps.map((p) => p.text) }];
          const next = (body[i + 1] || []).map((p) => p.text).find((t) => /シナリオ/.test(t)) || '';
          const sc = pptx.parseTask(shapes, next, scenarios.length);
          if (sc) scenarios.push(sc);
        });
        if (!scenarios.length) throw new Error('課題文のページ（「医療面接」「患者」を含むページ）が見つかりませんでした。');
        return scenarios;
      },
    };

    /* ==============================================================
       設定画面
       ============================================================== */
    const session = { scenarios: [], importedAt: null };

    function scenarioLabel(s) {
      // 「患者 田中 花子 さん（36歳女性）」→「田中 花子 さん」。主訴などは含めない
      const m = /^患者\s*(.*?さん)/.exec(s.patient || '');
      const name = m ? m[1].replace(/（[^）]*）/g, '').replace(/\s+/g, ' ') : (s.patient || '');
      return `${s.tag}　${name}`.trim();
    }

    /* 年齢は全角・半角どちらでも数字だけを受け付ける（半角に直して保存） */
    const ageClean = (v) => String(v || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');
    function manualScenario() {
      const lines = (id) => $(id).value.split('\n').map((t) => t.trim()).filter(Boolean);
      const m = manFromFields();
      const name = `${m.last} ${m.first}`.trim();
      return {
        tag: '', situation: lines('m-situ'),
        patient: name ? `患者 ${name} さん（${m.age ? m.age + '歳' : ''}${m.sex}）` : '',
        supplement: [], note: [],
      };
    }

    /* PreCC：患者情報だけ手入力（原文どおり「患者：〇〇 〇〇さん　歳　女性」）。入力したものは端末に覚えておく */
    const PRE_MAX = 6;
    const pre = { list: [] };
    const preKey = (p) => [p.last, p.first, p.age, p.sex].join('|');
    const preLabel = (p) => `${p.last} ${p.first}さん${p.age ? '　' + p.age + '歳' : ''}　${p.sex}`.trim();
    function preFromFields() {
      return { last: $('pre-last').value.trim(), first: $('pre-first').value.trim(), age: ageClean($('pre-age').value), sex: $('pre-sex').value };
    }
    function preScenario() {
      const p = preFromFields();
      if (!p.last && !p.first) return null;
      const name = `${p.last} ${p.first}`.trim();
      return {
        tag: '', situation: [],
        patient: `患者：${name}さん${p.age ? '　' + p.age + '歳' : ''}　${p.sex}`,
        supplement: [`${p.last || name}さんは初めて外来を受診されました。`], note: [],
      };
    }
    function buildPreOptions(selected) {
      const sel = $('pre-select');
      sel.textContent = '';
      const add = (v, l) => { const o = document.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o); };
      add('new', pre.list.length ? '新しく入力する' : '新しく入力する（空欄なら表示なし）');
      pre.list.forEach((p, i) => add('p' + i, preLabel(p)));
      sel.value = Array.from(sel.options).some((o) => o.value === selected) ? selected : 'new';
      $('pre-del').hidden = sel.value === 'new';
    }
    function preFill(p) {
      $('pre-last').value = p ? p.last : ''; $('pre-first').value = p ? p.first : '';
      $('pre-age').value = p ? p.age : ''; $('pre-sex').value = p ? p.sex : '女性';
    }
    function preRemember() {   // タイマー画面へ進むときに、新しい患者情報を保存する
      const p = preFromFields();
      if (!p.last && !p.first) return;
      const i = pre.list.findIndex((q) => preKey(q) === preKey(p));
      if (i >= 0) { buildPreOptions('p' + i); return; }
      pre.list.unshift(p);
      pre.list = pre.list.slice(0, PRE_MAX);
      store.set('osce.pre', pre.list);
      buildPreOptions('p0');
    }

    /* PostCC：手入力した課題文も端末に覚えておく（選んで呼び出し・消せる） */
    const MAN_MAX = 6;
    const man = { list: [] };
    const manFromFields = () => ({ situ: $('m-situ').value.trim(), last: $('m-last').value.trim(), first: $('m-first').value.trim(), age: ageClean($('m-age').value), sex: $('m-sex').value });
    const manKey = (m) => [m.situ, m.last, m.first, m.age, m.sex].join('|');
    const manLabel = (m) => `${m.last} ${m.first}さん${m.age ? '　' + m.age + '歳' : ''}　${m.sex}`.replace(/\s+/g, ' ').trim();
    function buildManOptions(selected) {
      const sel = $('man-select');
      sel.textContent = '';
      const add = (v, l) => { const o = document.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o); };
      add('new', '新しく入力する');
      man.list.forEach((m, i) => add('m' + i, manLabel(m)));
      sel.value = Array.from(sel.options).some((o) => o.value === selected) ? selected : 'new';
      $('man-del').hidden = sel.value === 'new';
    }
    function manFill(m) {
      $('m-situ').value = m ? m.situ : 'ここは初診外来です。';
      $('m-last').value = m ? m.last : ''; $('m-first').value = m ? m.first : '';
      $('m-age').value = m ? m.age : ''; $('m-sex').value = m ? m.sex : '女性';
      markChips();
    }
    function markChips() {
      document.querySelectorAll('.chips button').forEach((b) => b.classList.toggle('is-on', b.dataset.fill === $('m-situ').value.trim()));
    }
    const getSrc = () => document.querySelector('input[name="src"]:checked').value;
    function setSrc(v) { const r = document.querySelector(`input[name="src"][value="${v}"]`); if (r) r.checked = true; }
    function manRemember() {
      if (getSrc() !== 'manual') return;
      const m = manFromFields();
      if (!m.last && !m.first) return;
      const i = man.list.findIndex((q) => manKey(q) === manKey(m));
      if (i >= 0) { buildManOptions('m' + i); return; }
      man.list.unshift(m);
      man.list = man.list.slice(0, MAN_MAX);
      store.set('osce.manuals', man.list);
      buildManOptions('m0');
    }

    function buildScenarioOptions(selected) {
      const sel = $('scenario-select');
      sel.textContent = '';
      const add = (value, label) => { const o = document.createElement('option'); o.value = value; o.textContent = label; sel.appendChild(o); };
      if (!session.scenarios.length) add('none', '読み込んだシナリオはまだありません');
      const sources = [...new Set(session.scenarios.map((s) => s.source || ''))];
      if (sources.length > 1) {   // 複数のファイルを読み込んだときは、ファイルごとにまとめて表示
        sources.forEach((src) => {
          const g = document.createElement('optgroup'); g.label = src || 'ファイル';
          session.scenarios.forEach((s, i) => {
            if ((s.source || '') !== src) return;
            const o = document.createElement('option'); o.value = 's' + i; o.textContent = scenarioLabel(s); g.appendChild(o);
          });
          sel.appendChild(g);
        });
      } else {
        session.scenarios.forEach((s, i) => add('s' + i, scenarioLabel(s)));
      }
      sel.value = Array.from(sel.options).some((o) => o.value === selected) ? selected : sel.options[0].value;
      sel.disabled = !session.scenarios.length;
    }

    function importStatus(text, kind) {
      const el = $('import-status');
      el.textContent = text;
      el.dataset.state = kind || '';
    }

    function refreshImportStatus() {
      $('pptx-clear').hidden = !session.scenarios.length;
      if (session.scenarios.length) {
        const d = new Date(session.importedAt);
        const nf = new Set(session.scenarios.map((s) => s.source || '')).size;
        importStatus(`✓ ${session.scenarios.length}件のシナリオを読み込み済み（${nf > 1 ? nf + 'ファイル・' : ''}${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad2(d.getMinutes())}）。この端末に保存されています。`, 'ok');
      } else {
        importStatus('学習会の前に、その回のPowerPoint（.pptx）かPDFを読み込むと、その回のシナリオだけが選べます。複数のファイルをまとめて選べます（電波は要りません）。', '');
      }
    }

    function applySelection() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const presetKey = document.querySelector('input[name="preset"]:checked').value;
      const v = $('scenario-select').value;
      const entry = document.querySelector('input[name="entry"]:checked').value;
      // 課題文のもと：選んだ内容に応じて下の欄を切り替える
      const src = getSrc();
      $('src-pptx').hidden = src !== 'pptx';
      $('src-manual').hidden = src !== 'manual';
      state.mode = mode;
      state.readSec = (mode === 'exam' && entry === 'room') ? READ_SEC : 0;
      $('field-entry').hidden = mode !== 'exam';
      state.preset = PRESETS[presetKey] || PRESETS.postcc16;
      const isPre = presetKey === 'precc10';
      $('field-pre').hidden = !isPre;
      $('field-post').hidden = isPre;
      state.scenario = isPre ? preScenario()
                    : src === 'manual' ? manualScenario()
                    : src === 'pptx' && /^s\d+$/.test(v) ? session.scenarios[Number(v.slice(1))] || null
                    : null;
      document.body.dataset.mode = mode;
      store.set('osce.prefs', { preset: presetKey, mode, entry, scenario: v, src, view: document.body.dataset.view || 'text' });
      store.set('osce.manual', manFromFields());
    }

    function showTimerScreen() {
      applySelection(); if (state.preset !== PRESETS.precc10) manRemember();
      if ($('pre-select')) { applySelection(); if (state.preset === PRESETS.precc10) preRemember(); }
      applySelection();
      audio.load(state.preset);
      audio.unlock();
      timer.reset();
      renderTask();
      timer.render();
      $('setup-screen').style.display = 'none';
      $('app').classList.add('is-visible');
      fitTask();
    }

    function showSetupScreen() {
      timer.reset();
      peek.close();
      $('app').classList.remove('is-visible');
      $('setup-screen').style.display = '';
    }

    // 誤タップで画面を離れたり、リセットしたりしないように、動いている間は2回タップにする
    function guarded(button, label, needGuard, action) {
      let armedId = null;
      const original = button.textContent;
      const disarm = () => { clearTimeout(armedId); armedId = null; button.classList.remove('is-armed'); button.textContent = original; };
      button.addEventListener('click', () => {
        if (!needGuard() || armedId) { disarm(); action(); return; }
        button.classList.add('is-armed');
        button.textContent = label;
        armedId = setTimeout(disarm, ARM_MS);
      });
    }

    function onActivate(element, handler) {
      element.addEventListener('click', handler);
      element.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); }
      });
    }

    /* ==============================================================
       早送り／巻き戻し（押している間くり返し。長く押すほど速くなる）
       ============================================================== */
    function bindSeekButton(button, direction) {
      let intervalId = null;
      let ticks = 0;
      const step = () => {
        ticks++;
        const speed = ticks > 15 ? 15 : ticks > 6 ? 5 : 1;
        timer.setElapsed(timer.elapsed + direction * speed);
      };
      const stop = () => {
        if (intervalId) { clearInterval(intervalId); intervalId = null; }
        button.classList.remove('is-pressed');
      };
      button.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        try { button.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
        stop();
        ticks = 0;
        button.classList.add('is-pressed');
        timer.setElapsed(timer.elapsed + direction);
        intervalId = setInterval(step, 80);
      });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => button.addEventListener(type, stop));
      button.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    /* ==============================================================
       起動
       ============================================================== */
    function bindJump(id, delta) {
      const b = $(id);
      b.addEventListener('click', () => timer.setElapsed(timer.elapsed + delta));
    }

    function init() {
      $('btn-stop').addEventListener('click', () => timer.stop());
      bindJump('btn-back30', -30);
      bindJump('btn-fwd30', 30);
      // 前回の選択を戻す
      const saved = store.get('osce.session', null);
      if (saved && Array.isArray(saved.scenarios)) { session.scenarios = saved.scenarios; session.importedAt = saved.importedAt; }
      const prefs = store.get('osce.prefs', {});
      const manual = store.get('osce.manual', null);
      if (manual) {
        $('m-situ').value = manual.situ || ''; $('m-last').value = manual.last || ''; $('m-first').value = manual.first || '';
        $('m-age').value = manual.age || ''; $('m-sex').value = manual.sex === '男性' ? '男性' : '女性';
      }
      const check = (name, value) => { const r = document.querySelector(`input[name="${name}"][value="${value}"]`); if (r) r.checked = true; };
      // ライト／ダーク：最初は端末の設定のとおり。スイッチを触ったら、その選択を端末に覚えておく
      const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
      const effTheme = () => document.documentElement.dataset.theme || (mqDark.matches ? 'dark' : 'light');
      const showTheme = () => { const r = document.querySelector(`input[name="theme"][value="${effTheme()}"]`); if (r) r.checked = true; };
      showTheme();
      document.querySelectorAll('input[name="theme"]').forEach((r) => r.addEventListener('change', () => {
        document.documentElement.dataset.theme = r.value;
        try { localStorage.setItem('osce.theme', r.value); } catch (e) { /* 保存できなくても動作は続ける */ }
      }));
      if (mqDark.addEventListener) mqDark.addEventListener('change', showTheme);
      // 録音：起動するたびに「なし」から。「あり」にした瞬間にマイクの許可を求める
      document.querySelectorAll('input[name="rec"]').forEach((r) => r.addEventListener('change', async () => {
        if (r.value === 'on') {
          const ok = await rec.enable();
          if (!ok) document.querySelector('input[name="rec"][value="off"]').checked = true;
        } else rec.disable();
      }));
      if (REC_OK) recList.purge().catch(() => {}).then(() => recList.render());
      document.body.dataset.view = prefs.view === 'timer' ? 'timer' : 'text';
      $('btn-view').addEventListener('click', () => {
        document.body.dataset.view = document.body.dataset.view === 'timer' ? 'text' : 'timer';
        store.set('osce.prefs', Object.assign(store.get('osce.prefs', {}) || {}, { view: document.body.dataset.view }));
        fitTask();
      });
      if (prefs.preset) check('preset', prefs.preset);
      if (prefs.mode) check('mode', prefs.mode);
      if (prefs.entry) check('entry', prefs.entry);
      buildScenarioOptions(prefs.scenario);
      setSrc(prefs.src || (session.scenarios.length ? 'pptx' : 'manual'));
      markChips();
      pre.list = (store.get('osce.pre', []) || []).filter((p) => p && (p.last || p.first)).slice(0, PRE_MAX);
      buildPreOptions('new');
      man.list = (store.get('osce.manuals', []) || []).filter((m) => m && (m.last || m.first)).slice(0, MAN_MAX);
      buildManOptions('new');
      $('man-select').addEventListener('change', () => {
        const v = $('man-select').value;
        manFill(/^m\d+$/.test(v) ? man.list[Number(v.slice(1))] : null);
        $('man-del').hidden = v === 'new';
      });
      ['m-situ', 'm-last', 'm-first', 'm-age', 'm-sex'].forEach((id) => $(id).addEventListener('input', () => { $('man-select').value = 'new'; $('man-del').hidden = true; }));
      $('man-del').addEventListener('click', () => {
        const v = $('man-select').value;
        if (!/^m\d+$/.test(v)) return;
        man.list.splice(Number(v.slice(1)), 1);
        store.set('osce.manuals', man.list);
        manFill(null); buildManOptions('new');
      });
      $('pre-select').addEventListener('change', () => {
        const v = $('pre-select').value;
        preFill(/^p\d+$/.test(v) ? pre.list[Number(v.slice(1))] : null);
        $('pre-del').hidden = v === 'new';
      });
      ['pre-last', 'pre-first', 'pre-age', 'pre-sex'].forEach((id) => $(id).addEventListener('input', () => { $('pre-select').value = 'new'; $('pre-del').hidden = true; }));
      $('pre-del').addEventListener('click', () => {
        const v = $('pre-select').value;
        if (!/^p\d+$/.test(v)) return;
        pre.list.splice(Number(v.slice(1)), 1);
        store.set('osce.pre', pre.list);
        preFill(null); buildPreOptions('new');
      });
      refreshImportStatus();

      // 時間の種類を選んだ時点で音声を用意（このタップでiPhoneの音声許可も済ませる）
      document.querySelectorAll('input[name="preset"]').forEach((r) => r.addEventListener('change', () => {
        applySelection(); audio.load(state.preset);   // 音の準備だけ（鳴らす許可は、タイマー画面へ進むタップで行う）
      }));
      document.querySelectorAll('input[name="mode"], input[name="entry"]').forEach((r) => r.addEventListener('change', applySelection));
      document.querySelectorAll('input[name="src"]').forEach((r) => r.addEventListener('change', applySelection));
      $('scenario-select').addEventListener('change', applySelection);
      document.querySelectorAll('.chips button').forEach((b) => b.addEventListener('click', () => {
        $('m-situ').value = b.dataset.fill; $('man-select').value = 'new'; $('man-del').hidden = true; markChips();
      }));
      $('m-situ').addEventListener('input', markChips);
      ['pre-age', 'm-age'].forEach((id) => $(id).addEventListener('change', () => { $(id).value = ageClean($(id).value); }));

      $('pptx-file').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []).sort((a, b) => a.name.localeCompare(b.name, 'ja', { numeric: true }));
        e.target.value = '';
        if (!files.length) return;
        importStatus('読み込み中…', '');
        const all = []; const failed = [];
        for (const file of files) {
          try {
            const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
            const list = await (isPdf ? pdfdoc.parse(file) : pptx.parse(file));
            const source = file.name.replace(/\.[^.]+$/, '');
            list.forEach((s) => { s.source = source; all.push(s); });
          } catch (err) {
            failed.push(`${file.name}（${err && err.message ? err.message : err}）`);
          }
        }
        if (!all.length) { importStatus('読み込めませんでした：' + failed.join('、'), 'error'); return; }
        session.scenarios = all;
        session.importedAt = Date.now();
        store.set('osce.session', session);
        buildScenarioOptions('s0');
        refreshImportStatus();
        if (failed.length) importStatus(`${all.length}件を読み込みましたが、次のファイルは読み込めませんでした：${failed.join('、')}`, 'error');
      });
      $('pptx-clear').addEventListener('click', () => {
        session.scenarios = []; session.importedAt = null;
        store.remove('osce.session');
        buildScenarioOptions();
        refreshImportStatus();
      });

      $('go-timer').addEventListener('click', showTimerScreen);
      guarded($('btn-back'), 'もう一度タップで戻る', () => ['running', 'preparing', 'readintro', 'reading', 'readpaused'].includes(timer.status), showSetupScreen);
      guarded($('btn-reset'), 'もう一度タップ', () => ['running', 'preparing', 'readintro', 'reading', 'readpaused'].includes(timer.status), () => timer.reset());
      $('btn-start').addEventListener('click', () => timer.toggle());
      $('btn-skip').addEventListener('click', () => timer.skipRead());
      $('task-mini').addEventListener('click', () => peek.open());
      $('task-panel').addEventListener('click', () => { if ($('task-panel').classList.contains('is-peek')) peek.close(); });
      bindSeekButton($('btn-rewind'),  -1);
      bindSeekButton($('btn-forward'), +1);

      applySelection();
      audio.load(state.preset);
      renderTask();
      timer.render();
    }
    init();

    /* ==============================================================
       オフライン対応（Service Worker）
       ============================================================== */
    const offline = {
      statusEl: $('offline-status'),
      messages: {
        checking:    'オフライン準備中…',
        ready:       'オフラインで使えます',
        error:       'オフラインの準備に失敗しました。電波のある場所で開き直してください。',
        unsupported: 'このブラウザではオフライン保存が使えません。',
      },
      show(state_) {
        this.statusEl.dataset.state = state_;
        this.statusEl.textContent = this.messages[state_];
      },
      // 保存の完了（activated）か失敗（redundant）を見届ける
      watch(worker) {
        if (!worker) return;
        const check = () => {
          if (worker.state === 'activated') this.show('ready');
          if (worker.state === 'redundant') this.show('error');
        };
        worker.addEventListener('statechange', check);
        check();
      },
      async init() {
        // iPhone/iPadのSafariで、ホーム画面に追加していないときだけ案内を出す
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isStandalone = window.navigator.standalone === true ||
                             window.matchMedia('(display-mode: standalone)').matches;
        $('offline-hint').hidden = !(isIOS && !isStandalone);

        if (!('serviceWorker' in navigator)) { this.show('unsupported'); return; }
        try {
          const reg = await navigator.serviceWorker.register('./sw.js');
          if (reg.installing) this.watch(reg.installing);
          else if (reg.waiting) this.watch(reg.waiting);
          else if (reg.active) this.show('ready');
          reg.addEventListener('updatefound', () => {
            const w = reg.installing;
            if (w && navigator.serviceWorker.controller) {
              w.addEventListener('statechange', () => { if (w.state === 'redundant') this.show('error'); });
            }
          });
          if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        } catch (e) {
          this.show('error');
        }
      },
    };
    window.addEventListener('load', () => offline.init());
  </script>
</body>
